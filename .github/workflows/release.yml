# 推送 v* 标签（或在 GitHub 网页上新建 Release 并创建新标签）时自动构建，
# 打包 HdrPlayer + libmpv-2.dll（便携版 zip + 安装程序），上传到对应的 Release。
# 手动运行（Actions → Build → Run workflow）只构建并上传 artifact，不发布。
name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart("v", "V")
          } else {
            $tag = ""
            $ver = "0.0.0-ci.${{ github.run_number }}"
          }
          # 程序集版本只能是数字，去掉 -beta 之类的后缀
          $num = ($ver -split "[-+]")[0]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "number=$num" >> $env:GITHUB_OUTPUT

      - name: 编译
        shell: pwsh
        run: >
          dotnet publish HdrPlayer.csproj -c Release -r win-x64 --self-contained false
          -p:Version=${{ steps.ver.outputs.number }}
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: 下载 libmpv（shinchiro/mpv-winbuild-cmake 最新版）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mpv | Out-Null
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-v3-*.7z" --dir mpv
          $archive = Get-ChildItem mpv -Filter *.7z | Select-Object -First 1
          if (-not $archive) { throw "没有找到 mpv-dev-x86_64-v3 压缩包" }
          Write-Host "libmpv: $($archive.Name)"
          # 压缩包里还有 include/、libmpv.dll.a 等开发文件，只解出 libmpv-2.dll（-r：不管它在哪层目录）
          7z e $archive.FullName libmpv-2.dll -r -o"publish" -y | Out-Null
          if (-not (Test-Path publish/libmpv-2.dll)) { throw "压缩包里没有 libmpv-2.dll" }
          "$($archive.Name)" | Out-File -Encoding utf8 publish/libmpv-version.txt

      # ---- 自动同步字幕：ffsubsync（https://github.com/smacke/ffsubsync）+ ffmpeg，放在 publish/tools 下 ----
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 打包 ffsubsync（PyInstaller）
        shell: pwsh
        # 固定版本，避免上游更新改了命令行参数或日志格式（程序会解析 offset / framerate 两行日志）
        run: |
          python -m pip install --disable-pip-version-check "ffsubsync==0.5.1" "pyinstaller>=6.10"
          if ($LASTEXITCODE -ne 0) { throw "pip install 失败" }
          pyinstaller --noconfirm --log-level WARN --onedir --console --name ffsubsync `
            --collect-all ffsubsync --collect-all webrtcvad --copy-metadata ffsubsync `
            --distpath build-ffs/dist --workpath build-ffs/work --specpath build-ffs installer/ffsubsync_entry.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 失败" }
          New-Item -ItemType Directory -Force publish/tools | Out-Null
          Copy-Item -Recurse build-ffs/dist/ffsubsync publish/tools/ffsubsync
          & publish/tools/ffsubsync/ffsubsync.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ffsubsync.exe 无法运行" }

      - name: 下载 ffmpeg（BtbN/FFmpeg-Builds 最新稳定分支，LGPL 动态库版）
        shell: pwsh
        # ffsubsync 用 ffmpeg 解出音轨、用 ffprobe 读流信息；只需要解码器，LGPL 版就够了
        run: |
          $names = gh release view latest --repo BtbN/FFmpeg-Builds --json assets -q ".assets[].name"
          $zip = $names | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-lgpl-shared-[\d.]+\.zip$' } |
            Sort-Object { $m = [regex]::Match($_, '^ffmpeg-n(\d+)\.(\d+)'); [int]$m.Groups[1].Value * 1000 + [int]$m.Groups[2].Value } |
            Select-Object -Last 1
          if (-not $zip) { throw "没有找到 ffmpeg 压缩包" }
          Write-Host "ffmpeg: $zip"
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern $zip --dir ffmpeg-dl
          Expand-Archive "ffmpeg-dl/$zip" -DestinationPath ffmpeg-dl/x -Force
          $bin = Get-ChildItem ffmpeg-dl/x -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory -Force publish/tools/ffmpeg | Out-Null
          Copy-Item "$($bin.FullName)/ffmpeg.exe", "$($bin.FullName)/ffprobe.exe" publish/tools/ffmpeg/
          Copy-Item "$($bin.FullName)/*.dll" publish/tools/ffmpeg/
          & publish/tools/ffmpeg/ffprobe.exe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "ffprobe 无法运行" }
          "$zip" | Out-File -Encoding utf8 publish/tools/ffmpeg/version.txt

      - name: 打包
        id: pack
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          $name = "HdrPlayer-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $name -Force
          "zip=$name" >> $env:GITHUB_OUTPUT

      - name: 下载 Inno Setup
        shell: pwsh
        # 固定 6.7.1：中文语言文件需要 6.5+，也避免以后自动装到 7.x 时行为变化（这个版本在 wine 下实测编译、安装、卸载过）。
        # 从 nuget.org 的 Tools.InnoSetup 包取，不依赖 runner 上预装的版本
        run: |
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.1/tools.innosetup.6.7.1.nupkg -OutFile inno.zip
          Expand-Archive inno.zip -DestinationPath inno -Force

      - name: 生成安装程序
        id: setup
        shell: pwsh
        run: |
          $iscc = "$PWD\inno\tools\ISCC.exe"
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\publish" "/DOutputDir=$PWD\dist" installer\HdrPlayer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败" }
          $exe = Get-ChildItem dist -Filter *-setup.exe | Select-Object -First 1
          "exe=dist/$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: HdrPlayer-${{ steps.ver.outputs.version }}-win-x64
          path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.setup.outputs.exe }}

      - name: 发布到 Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zip = "${{ steps.pack.outputs.zip }}"
          $exe = "${{ steps.setup.outputs.exe }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 已经在网页上建好了 Release：只上传文件
            gh release upload $tag $zip $exe --clobber
          } else {
            $ghArgs = @($tag, $zip, $exe, "--title", "HdrPlayer $tag", "--generate-notes")
            if ($tag -match "-") { $ghArgs += "--prerelease" }   # v1.0-beta 这类标签发成预发布
            gh release create @args
          }
          if ($LASTEXITCODE -ne 0) { throw "发布失败" }
